{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Добавить расходы</title>
  <link rel="stylesheet" href="{% static 'styles4.css' %}">
</head>
<body>
  <a class="back" href="{% url 'main_page' %}">На главную</a>

  <main>
    <form class="form" action="{% url 'expenses' %}" method="post">
      {% csrf_token %}

      <!-- Эти кнопки стоят первыми в коде, чтобы Enter в поле даты сохранял таблицу,
           а не добавлял строку. На экране их положение задаёт CSS (position: fixed). -->
      <div class="buttons">
        <a class="cancel" href="{% url 'expenses' %}">Отмена</a>
        <button class="save" type="submit">Сохранить</button>
      </div>

      <div class="top-bar">
        <button class="add" type="submit" name="action" value="add_row"
                formnovalidate formaction="{% url 'expenses' %}#last-row">Продолжить таблицу</button>
        {% for message in messages %}
          <p class="message {{ message.tags }}">{{ message }}</p>
        {% endfor %}
      </div>

      <div class="table-wrap">
        <table class="table">
          <thead>
            <tr>
              <th>Дата</th>
              <th>Вид кошелька</th>
              <th>Категория расходов</th>
              <th>Сумма</th>
            </tr>
          </thead>
          <tbody>
            {% for row in rows %}
            <tr{% if forloop.last %} id="last-row"{% endif %}>
              <td>
                <label class="cell">
                  <input type="text" name="date" value="{{ row.date }}" maxlength="10"
                         inputmode="numeric" autocomplete="off" placeholder="ДД.ММ.ГГГГ"
                         pattern="\d{2}[.\-/]\d{2}[.\-/]\d{4}|\d{4}-\d{2}-\d{2}"
                         title="Дата в формате ДД.ММ.ГГГГ"
                         aria-label="Дата"
                         {% if added and forloop.last %}autofocus{% endif %}>
                </label>
              </td>
              <td>
                <label class="cell">
                  <textarea name="wallet" rows="1" maxlength="2000" autocomplete="off"
                            aria-label="Вид кошелька">
{{ row.wallet }}</textarea>
                </label>
              </td>
              <td>
                <label class="cell">
                  <textarea name="category" rows="1" maxlength="2000" autocomplete="off"
                            aria-label="Категория расходов">
{{ row.category }}</textarea>
                </label>
              </td>
              <td>
                <label class="cell">
                  <textarea name="amount" rows="1" maxlength="2000" autocomplete="off"
                            aria-label="Сумма в рублях">
{{ row.amount }}</textarea>
                </label>
              </td>
            </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
    </form>
  </main>
</body>
</html>

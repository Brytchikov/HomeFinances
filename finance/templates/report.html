{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Отчёт</title>
  <link rel="stylesheet" href="{% static 'styles6.css' %}">
</head>
<body>
  <a class="back" href="{% url 'main_page' %}">На главную</a>

  <main class="report">
    <div class="table-wrap">
      <table class="table">
        <thead>
          <tr>
            <th>Дата</th>
            <th>Вид кошелька</th>
            <th>Транзакция</th>
            <th>Сумма</th>
          </tr>
        </thead>
        <tbody>
          {% for op in operations %}
          <tr>
            <td class="date">{% if op.date %}{{ op.date|date:"d.m.Y" }}{% endif %}</td>
            <td>{{ op.wallet }}</td>
            <td>{{ op.title }}</td>
            <td class="amount {{ op.kind }}">
              {% if op.kind %}{% if op.kind == 'income' %}+{% else %}−{% endif %}{{ op.amount }} ₽{% endif %}
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </main>
</body>
</html>
